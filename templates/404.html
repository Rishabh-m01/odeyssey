{% extends "base.html" %}

{% block title %}Page Not Found — ODEYSSEY{% endblock %}

{% block content %}
<div class="container error-page">
  <div class="error-card">
    <span class="error-code">404</span>
    <h1 class="error-title">Page not found</h1>
    <p class="error-text">
      The route you requested doesn't exist or has moved. Return to the home page or try the trip planner.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Home</a>
      <a href="{{ url_for('planner') }}" class="btn btn-secondary">Open Planner</a>
    </div>
  </div>
</div>
{% endblock %}
