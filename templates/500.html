{% extends "base.html" %}

{% block title %}Server Error — ODEYSSEY{% endblock %}

{% block content %}
<div class="container error-page">
  <div class="error-card">
    <span class="error-code">500</span>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-text">
      The server encountered an unexpected error processing your request. Please try again in a moment.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('planner') }}" class="btn btn-primary">Return to Planner</a>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Home</a>
    </div>
  </div>
</div>
{% endblock %}
